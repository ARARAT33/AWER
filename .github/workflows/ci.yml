name: CI
on:
  push:
    branches: [main, "phase-2/**", "phase-3/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: node --check mcp-server/index.js
      - run: node --check api/managed/github-repositories.js
      - run: node --check api/managed/vercel-projects.js
      - run: node --check api/managed/supabase-projects.js
      - run: node --check api/managed/neon-projects.js
      - run: node --check src/main.js
      - run: npm run build
